# Mush8 - project.yml
# Constantin Clerc (c22dev) - 0.1

name: Mush8
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  Mush8:
    type: application
    platform: iOS
    sources:
      - path: stub.c
      - path: ../AppIcon.icon
      - path: ../target/ios-res/modules
        type: folder
        buildPhase: resources
      - path: ../target/ios-res/shaders
        type: folder
        buildPhase: resources
      - path: ../target/ios-res/fallback
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.cclerc.mush8
        PRODUCT_NAME: Mush8
        EXECUTABLE_NAME: nxhost
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Mush8.entitlements
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        DEBUG_INFORMATION_FORMAT: dwarf
    postBuildScripts:
      - name: Use the Rust executable
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cp "$SRCROOT/../target/ios/aarch64-apple-ios/release/nxhost" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
